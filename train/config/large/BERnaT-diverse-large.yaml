################## BERnaT-diverse ##################

### RunArguments Class ###

model_name: ixa-ehu/roberta-eus-euscrawl-large-cased
max_length: 512
reference_tokenizer_name: FacebookAI/roberta-base
attn_implementation: sdpa
train_data: Diverse
resume_from_checkpoint: False
from_scratch: True

### TrainingArguments Class ###

num_train_epochs: 100
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler_type: linear
warmup_ratio: 0.01

per_device_train_batch_size: 64
per_device_eval_batch_size: 64
gradient_accumulation_steps: 1
seed: 42
optim: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.98
adam_epsilon: 1e-6

do_train: True
do_eval: True
fp16: True

eval_strategy: epoch
save_strategy: epoch

save_total_limit: 100
load_best_model_at_end: True
report_to: wandb
logging_strategy: steps
logging_steps: 25

ddp_find_unused_parameters: False
remove_unused_columns: True

run_name: BERnaT-diverse-large
output_dir: checkpoints