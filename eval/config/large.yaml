################## Large evaluation ##################

### RunArguments Class ###

task: bec # Choose the task to evaluate
model_name: BERnaT/BERnaT-large
tokenizer_name: BERnaT/BERnaT-large
attn_implementation: sdpa
from_scratch: False
max_length: 512
percentage: 1.0

### TrainingArguments Class ###

do_train: True
do_eval: True
fp16: True

# If task in ('bec', 'bhtc', 'vaxx', 'coref') use these hyperparameters
num_train_epochs: 10
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
learning_rate: 1e-5
lr_scheduler_type: linear
warmup_ratio: 0.06

# With any other task use these hyperparameters
# num_train_epochs: 4
# per_device_train_batch_size: 32
# per_device_eval_batch_size: 32
# learning_rate: 2.5e-5
# lr_scheduler_type: constant

gradient_accumulation_steps: 1
optim: adamw_torch

run_name: BERnaT-large-eval
output_dir: eval/BERnaT-large

eval_strategy: epoch
save_strategy: epoch

save_total_limit: 1
load_best_model_at_end: True
report_to: wandb
logging_strategy: steps
logging_steps: 10